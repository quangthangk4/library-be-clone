spring:
  application:
    name: library-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/library
    username: library
    password: library

  jpa:
    hibernate:
      ddl-auto: validate  # Changed from 'update' - let Flyway manage schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true  # Prevent accidental data loss

server:
  port: 8080


