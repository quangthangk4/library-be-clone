spring:
  application:
    name: library-management-system

  datasource:
    url: jdbc:postgres://localhost:5432/library
    username: library
    password: library

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

